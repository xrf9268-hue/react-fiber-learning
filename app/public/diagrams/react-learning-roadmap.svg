"12.000000" width="323.000000" height="73.000000" stroke="#f8fafc" fill="#f8fafc" style="stroke-width:2;" /></g><text x="264.500000" y="56.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:22px">React Fiber 学习路线总图</text></g><g class="cm9hZG1hcA=="><g class="shape" ><rect x="12.000000" y="110.000000" width="505.000000" height="436.000000" stroke="#ffffff" fill="#ffffff" style="stroke-width:2;" /></g></g><g class="aGludA== note"><g class="shape" ><rect x="85.000000" y="571.000000" width="358.000000" height="77.000000" rx="14.000000" stroke="#cbd5e1" fill="#f8fafc" style="stroke-width:1;" /></g><text x="264.000000" y="607.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="264.000000" dy="0.000000">学习顺序：M1 → M2 → M3 → M4 → M5 → M6</tspan><tspan x="264.000000" dy="16.000000">从问题意识到阻塞恢复机制的连续解释链</tspan></text></g><g class="cm9hZG1hcC5NMQ== emphasis-cyan"><g class="shape" ><rect x="28.000000" y="126.000000" width="238.000000" height="124.000000" rx="14.000000" stroke="#06b6d4" fill="#ecfeff" style="stroke-width:2;" /></g><text x="147.000000" y="163.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="147.000000" dy="0.000000">M1 为什么需要 Fiber</tspan><tspan x="147.000000" dy="15.800000">问题：旧同步渲染</tspan><tspan x="147.000000" dy="15.800000">为什么不够？</tspan><tspan x="147.000000" dy="15.800000">结论：把渲染改造成</tspan><tspan x="147.000000" dy="15.800000">可调度的工作系统</tspan></text></g><g class="cm9hZG1hcC5NMg== emphasis-blue"><g class="shape" ><rect x="28.000000" y="266.000000" width="238.000000" height="124.000000" rx="14.000000" stroke="#2563eb" fill="#eff6ff" style="stroke-width:2;" /></g><text x="147.000000" y="303.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="147.000000" dy="0.000000">M2 Fiber 节点与遍历</tspan><tspan x="147.000000" dy="15.800000">问题：工作单元</tspan><tspan x="147.000000" dy="15.800000">长什么样？</tspan><tspan x="147.000000" dy="15.800000">结论：child/sibling/return</tspan><tspan x="147.000000" dy="15.800000">拆成显式工作节点</tspan></text></g><g class="cm9hZG1hcC5NMw== emphasis-orange"><g class="shape" ><rect x="28.000000" y="406.000000" width="238.000000" height="124.000000" rx="14.000000" stroke="#ea580c" fill="#fff7ed" style="stroke-width:2;" /></g><text x="147.000000" y="443.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="147.000000" dy="0.000000">M3 双树与 render/commit</tspan><tspan x="147.000000" dy="15.800000">问题：如何准备下一版</tspan><tspan x="147.000000" dy="15.800000">又保持界面稳定？</tspan><tspan x="147.000000" dy="15.800000">结论：current 与 WIP 分工</tspan><tspan x="147.000000" dy="15.800000">commit 统一切换</tspan></text></g><g class="cm9hZG1hcC5NNA== emphasis-purple"><g class="shape" ><rect x="282.000000" y="126.000000" width="219.000000" height="124.000000" rx="14.000000" stroke="#7c3aed" fill="#f5f3ff" style="stroke-width:2;" /></g><text x="391.500000" y="163.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="391.500000" dy="0.000000">M4 一次更新全链路</tspan><tspan x="391.500000" dy="15.800000">问题：setState 怎样</tspan><tspan x="391.500000" dy="15.800000">走到 render/commit？</tspan><tspan x="391.500000" dy="15.800000">结论：先登记</tspan><tspan x="391.500000" dy="15.800000">再调度，再提交</tspan></text></g><g class="cm9hZG1hcC5NNQ== emphasis-green"><g class="shape" ><rect x="282.000000" y="266.000000" width="219.000000" height="124.000000" rx="14.000000" stroke="#16a34a" fill="#f0fdf4" style="stroke-width:2;" /></g><text x="391.500000" y="303.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="391.500000" dy="0.000000">M5 lanes 与 scheduler</tspan><tspan x="391.500000" dy="15.800000">问题：多批更新时</tspan><tspan x="391.500000" dy="15.800000">先做什么？</tspan><tspan x="391.500000" dy="15.800000">结论：lane 归类</tspan><tspan x="391.500000" dy="15.800000">root 选批次</tspan></text></g><g class="cm9hZG1hcC5NNg== emphasis-red"><g class="shape" ><rect x="282.000000" y="406.000000" width="219.000000" height="124.000000" rx="14.000000" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="391.500000" y="443.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="391.500000" dy="0.000000">M6 Suspense/Offscreen</tspan><tspan x="391.500000" dy="15.800000">问题：做不下去时</tspan><tspan x="391.500000" dy="15.800000">怎么处理？</tspan><tspan x="391.500000" dy="15.800000">结论：suspend→fallback</tspan><tspan x="391.500000" dy="15.800000">→ping→retry</tspan></text></g><g class="KHRpdGxlIC0mZ3Q7IHJvYWRtYXApWzBd"><marker id="mk-d2-288872929-469228098" markerWidth="10.000000" markerHeight="12.000000" refX="10.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0.000000,0.000000 10.000000,6.000000 0.000000,12.000000" fill="#ffffff" class="connection" stroke-width="0" /> </marker><path d="M 264.500000 86.000000 L 264.500000 109.000000" stroke="#ffffff" fill="none" class="connection" style="stroke-width:0;" marker-end="url(#mk-d2-288872929-469228098)" mask="url(#d2-288872929)" /></g><g class="KHJvYWRtYXAgLSZndDsgaGludClbMF0="><path d="M 264.500000 547.000000 L 264.500000 570.500000" stroke="#ffffff" fill="none" class="connection" style="stroke-width:0;" marker-end="url(#mk-d2-288872929-469228098)" mask="url(#d2-288872929)" /></g><mask id="d2-288872929" maskUnits="userSpaceOnUse" x="-9" y="-9" width="547" height="677">
