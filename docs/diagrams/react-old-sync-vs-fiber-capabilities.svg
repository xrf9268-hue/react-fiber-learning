<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style><![CDATA[
      .title { font: 700 30px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .section { font: 700 18px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .label { font: 700 14px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .body { font: 400 14px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .small { font: 400 12px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .mono { font: 600 13px 'JetBrains Mono','Fira Code','SFMono-Regular',monospace; fill: #0f172a; }
      .shadow { filter: drop-shadow(0 6px 18px rgba(15,23,42,0.08)); }
      .arrow-slate { stroke: #475569; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-slate); }
      .arrow-red { stroke: #dc2626; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    ]]></style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="44" y="60" class="title">旧同步渲染模型 vs Fiber 能力对比</text>
  <text x="44" y="88" class="subtitle">M1 对比图：重点不是“谁更快”，而是 React 对渲染工作的控制力发生了什么变化。</text>

  <rect x="1318" y="34" width="232" height="28" rx="14" fill="#ecfeff"/>
  <text x="1434" y="53" class="small" text-anchor="middle">M1 核心图 · 问题意识入口</text>

  <rect x="52" y="140" width="698" height="708" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <rect x="52" y="140" width="698" height="58" rx="26" fill="#fee2e2"/>
  <path d="M 52 198 L 750 198" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="176" class="section">旧的同步渲染模型</text>
  <text x="82" y="192" class="small">一旦开始一轮大更新，往往很难在中途重排工作的轻重缓急</text>

  <rect x="84" y="234" width="268" height="96" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="110" y="268" class="label">开始更新</text>
  <text x="110" y="296" class="small">组件触发渲染后，主线程上很容易形成一整块连续工作</text>

  <rect x="84" y="372" width="268" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="406" class="label">持续执行到较后阶段</text>
  <text x="110" y="434" class="small">期间难以及时让位给更急的输入、点击或切换</text>
  <text x="110" y="454" class="small">控制粒度偏粗</text>

  <rect x="84" y="522" width="268" height="114" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="556" class="label">中途控制能力弱</text>
  <text x="110" y="584" class="small">难以暂停、恢复、跳过，</text>
  <text x="110" y="604" class="small">也不擅长优雅丢弃已过时工作</text>

  <rect x="84" y="678" width="268" height="120" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="712" class="label">最终效果</text>
  <text x="110" y="740" class="small">更像“一路做完再看到结果”，</text>
  <text x="110" y="760" class="small">响应性、优先级取舍和陈旧工作回收都更吃力</text>

  <path d="M 218 330 L 218 372" class="arrow-red"/>
  <path d="M 218 480 L 218 522" class="arrow-red"/>
  <path d="M 218 636 L 218 678" class="arrow-red"/>

  <rect x="398" y="234" width="316" height="564" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="428" y="270" class="section">旧模型暴露出的三类压力</text>
  <rect x="428" y="298" width="256" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="452" y="332" class="label">1. 响应性压力</text>
  <text x="452" y="360" class="small">用户已经产生新输入，</text>
  <text x="452" y="380" class="small">但当前大更新还没有及时让出执行机会</text>
  <rect x="428" y="434" width="256" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="452" y="468" class="label">2. 优先级压力</text>
  <text x="452" y="496" class="small">更紧急的工作，不一定能先于</text>
  <text x="452" y="516" class="small">不那么紧急的工作被处理</text>
  <rect x="428" y="570" width="256" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="452" y="604" class="label">3. 陈旧工作压力</text>
  <text x="452" y="632" class="small">做到一半的结果可能已经过时，</text>
  <text x="452" y="652" class="small">但旧模型不擅长优雅放弃它</text>
  <rect x="428" y="724" width="256" height="50" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="556" y="754" class="small" text-anchor="middle">根问题：对渲染工作的控制粒度不够细</text>

  <rect x="794" y="140" width="754" height="708" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <rect x="794" y="140" width="754" height="58" rx="26" fill="#dcfce7"/>
  <path d="M 794 198 L 1548 198" stroke="#cbd5e1" stroke-width="1"/>
  <text x="824" y="176" class="section">Fiber 支持的工作模型</text>
  <text x="824" y="192" class="small">把渲染变成可调度的内部工作系统：可以中断、恢复、排序、放弃，但提交仍保持一致</text>

  <rect x="828" y="234" width="276" height="96" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="854" y="268" class="label">开始更新</text>
  <text x="854" y="296" class="small">不是立刻整块做到底，而是先把渲染组织成可推进的工作</text>

  <rect x="828" y="372" width="276" height="116" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="854" y="406" class="label">拆开并推进工作</text>
  <text x="854" y="434" class="small">render 可以按工作单元逐步推进，</text>
  <text x="854" y="454" class="small">不必把整棵树当成不可拆分的大事务</text>

  <rect x="828" y="530" width="276" height="184" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="854" y="564" class="label">中途可做的四件事</text>
  <text x="854" y="592" class="small">• 暂停：先让出执行机会</text>
  <text x="854" y="614" class="small">• 继续：稍后接着做</text>
  <text x="854" y="636" class="small">• 让位：更高优先级工作先走</text>
  <text x="854" y="658" class="small">• 放弃：未完成且已过时的工作可以直接丢弃</text>
  <text x="854" y="688" class="small">重点是控制力，而不只是“更快”</text>

  <rect x="828" y="756" width="276" height="58" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="966" y="792" class="label" text-anchor="middle">整棵结果准备妥当后，再统一 commit</text>

  <path d="M 966 330 L 966 372" class="arrow-green"/>
  <path d="M 966 488 L 966 530" class="arrow-green"/>
  <path d="M 966 714 L 966 756" class="arrow-green"/>

  <rect x="1152" y="234" width="360" height="280" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1182" y="270" class="section">Fiber 带来的关键外显能力</text>
  <rect x="1182" y="298" width="300" height="52" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="1206" y="330" class="small">更容易让紧急交互及时响应</text>
  <rect x="1182" y="366" width="300" height="52" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="1206" y="398" class="small">可以把过时的中间结果直接丢弃</text>
  <rect x="1182" y="434" width="300" height="52" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="1206" y="466" class="small">可以在后台准备下一版界面</text>

  <rect x="1152" y="548" width="360" height="266" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="1182" y="584" class="section">最重要的边界</text>
  <text x="1182" y="622" class="body">
    <tspan x="1182" dy="0">可中断的是 render，</tspan>
    <tspan x="1182" dy="24">不是把半成品 UI 直接暴露给用户。</tspan>
    <tspan x="1182" dy="30">React 会先准备结果，</tspan>
    <tspan x="1182" dy="24">等到提交边界再统一 commit，</tspan>
    <tspan x="1182" dy="24">从而保持对外界面的整体一致性。</tspan>
  </text>
  <rect x="1182" y="730" width="300" height="52" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="1332" y="762" class="small" text-anchor="middle">一句话：Fiber = 带一致性约束的可调度渲染能力</text>

  <rect x="52" y="886" width="1496" height="44" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="800" y="914" class="small" text-anchor="middle">读图顺序建议：先看左侧“旧模型为什么不够”，再看右侧“Fiber 到底新增了哪些控制能力”，最后记住“可中断的是 render，不是半成品 commit”。</text>
</svg>
