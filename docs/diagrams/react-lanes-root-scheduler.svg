<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style><![CDATA[
      .title { font: 700 30px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .section { font: 700 18px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .label { font: 700 14px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .body { font: 400 14px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .small { font: 400 12px 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .mono { font: 600 13px 'JetBrains Mono','Fira Code','SFMono-Regular',monospace; fill: #0f172a; }
      .shadow { filter: drop-shadow(0 6px 18px rgba(15,23,42,0.08)); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .arrow-orange { stroke: #ea580c; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .arrow-slate { stroke: #475569; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-slate); }
    ]]></style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1600" height="980" fill="#f8fafc"/>
  <text x="44" y="60" class="title">lanes / root / scheduler 协作图</text>
  <text x="44" y="88" class="subtitle">说明更新如何先进入 lane，再由 root 统一选下一批工作，最后由 scheduler 提供执行机会；并发不等于多线程。</text>

  <rect x="1290" y="34" width="260" height="28" rx="14" fill="#dcfce7"/>
  <text x="1420" y="53" class="small" text-anchor="middle">M5 核心图 · root 统一记账</text>

  <rect x="52" y="150" width="250" height="640" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <text x="82" y="196" class="section">① Update Sources</text>
  <rect x="82" y="232" width="190" height="88" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="106" y="266" class="label">输入 / 点击</text>
  <text x="106" y="292" class="small">离用户最近，通常更急</text>
  <rect x="82" y="344" width="190" height="88" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="106" y="378" class="label">普通 setState / render 触发</text>
  <text x="106" y="404" class="small">默认更新进入系统</text>
  <rect x="82" y="456" width="190" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="106" y="490" class="label">startTransition</text>
  <text x="106" y="516" class="small">明确声明：这批更新</text>
  <text x="106" y="536" class="small">可以让位给更急工作</text>
  <rect x="82" y="580" width="190" height="140" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="106" y="614" class="label">恢复中的工作</text>
  <text x="106" y="640" class="small">例如之前被 suspend，</text>
  <text x="106" y="660" class="small">现在又重新可做</text>

  <rect x="350" y="150" width="260" height="640" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <text x="380" y="196" class="section">② Lane Assignment</text>
  <rect x="382" y="236" width="196" height="78" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="406" y="268" class="label">Sync / Input lanes</text>
  <text x="406" y="292" class="small">更紧急，通常先做</text>
  <rect x="382" y="344" width="196" height="78" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="406" y="376" class="label">Default lanes</text>
  <text x="406" y="400" class="small">普通更新的默认落点</text>
  <rect x="382" y="452" width="196" height="94" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="406" y="484" class="label">Transition lanes</text>
  <text x="406" y="508" class="small">可让位的非紧急更新</text>
  <rect x="382" y="576" width="196" height="112" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="406" y="608" class="label">Pinged / Retry lanes</text>
  <text x="406" y="632" class="small">之前做不了，现在值得再试</text>

  <rect x="660" y="120" width="420" height="700" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <text x="690" y="166" class="section">③ Root Ledger + getNextLanes</text>
  <rect x="700" y="206" width="340" height="92" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="726" y="238" class="label">pendingLanes</text>
  <text x="726" y="264" class="small">系统里还有哪些工作没做完</text>
  <text x="726" y="284" class="mono">markRootUpdated(root, lane, eventTime)</text>
  <rect x="700" y="324" width="340" height="92" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="726" y="356" class="label">suspendedLanes</text>
  <text x="726" y="382" class="small">当前暂时做不下去的工作</text>
  <text x="726" y="402" class="mono">先别盲目重试</text>
  <rect x="700" y="442" width="340" height="92" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="726" y="474" class="label">pingedLanes</text>
  <text x="726" y="500" class="small">之前挂住，现在又重新可做</text>
  <text x="726" y="520" class="mono">恢复候选，不等于立刻提交</text>
  <rect x="700" y="560" width="340" height="92" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="726" y="592" class="label">expiredLanes</text>
  <text x="726" y="618" class="small">不能再拖，否则会饿死</text>
  <text x="726" y="638" class="mono">需要尽快被纳入下一轮</text>
  <rect x="700" y="682" width="340" height="100" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="726" y="714" class="label">getNextLanes(root, wipLanes)</text>
  <text x="726" y="740" class="small">从 root 的总账里挑出当前最值得处理的一批 lanes。</text>
  <text x="726" y="760" class="small">优先级判断发生在这里，不在 scheduler 里。</text>

  <rect x="1128" y="214" width="190" height="220" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <text x="1152" y="252" class="section">④ Scheduler</text>
  <text x="1152" y="290" class="body">
    <tspan x="1152" dy="0">职责：提供 callback</tspan>
    <tspan x="1152" dy="24">执行机会。</tspan>
    <tspan x="1152" dy="28">它不决定业务优先级，</tspan>
    <tspan x="1152" dy="24">只是决定“何时再给 root</tspan>
    <tspan x="1152" dy="24">一轮执行窗口”。</tspan>
  </text>

  <rect x="1360" y="214" width="188" height="220" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <text x="1386" y="252" class="section">⑤ Render Work Loop</text>
  <text x="1386" y="290" class="body">
    <tspan x="1386" dy="0">沿 workInProgress</tspan>
    <tspan x="1386" dy="24">逐 Fiber 推进。</tspan>
    <tspan x="1386" dy="28">并发 ≠ 多线程；</tspan>
    <tspan x="1386" dy="24">而是可以让位、继续、</tspan>
    <tspan x="1386" dy="24">放弃过时工作。</tspan>
  </text>

  <path d="M 272 276 L 382 276" class="arrow-slate"/>
  <path d="M 272 388 L 382 388" class="arrow-blue"/>
  <path d="M 272 506 L 382 506" class="arrow-purple"/>
  <path d="M 272 646 L 382 646" class="arrow-orange"/>

  <path d="M 578 276 L 700 252" class="arrow-red"/>
  <path d="M 578 388 L 700 370" class="arrow-blue"/>
  <path d="M 578 500 L 700 488" class="arrow-purple"/>
  <path d="M 578 632 L 700 604" class="arrow-orange"/>

  <path d="M 1040 732 C 1094 732, 1094 324, 1128 324" class="arrow-slate"/>
  <path d="M 1318 324 L 1360 324" class="arrow-green"/>

  <rect x="1130" y="490" width="418" height="160" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1156" y="526" class="label">最容易误解的边界</text>
  <text x="1156" y="560" class="body">
    <tspan x="1156" dy="0">1. 更新先进入 lane，而不是见到更新就立刻算完整棵树。</tspan>
    <tspan x="1156" dy="26">2. root 统一判断“下一批最该做什么”；scheduler 不替 root 做这件事。</tspan>
    <tspan x="1156" dy="26">3. startTransition 表示“可让位”，不是另一套独立渲染引擎。</tspan>
    <tspan x="1156" dy="26">4. 并发的关键是可中断、可恢复、可让位，不是多线程并行执行。</tspan>
  </text>

  <rect x="52" y="842" width="1496" height="88" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" class="shadow"/>
  <text x="800" y="878" class="section" text-anchor="middle">一句话总结：lane 负责给更新归类，root 负责从总账里选下一批工作，scheduler 负责给这批工作安排执行机会。</text>
  <text x="800" y="906" class="small" text-anchor="middle">因此 React 的“并发”首先是一种调度与取舍能力，而不是“开更多线程”。</text>
</svg>